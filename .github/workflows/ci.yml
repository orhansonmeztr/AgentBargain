name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        run: uv run ruff check src/ tests/ alembic/

      - name: Format check with ruff
        run: uv run ruff format --check src/ tests/ alembic/

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
        env:
          GOOGLE_API_KEY: ""
          OPENAI_API_KEY: ""
          OLLAMA_BASE_URL: "http://localhost:11434"
          LANGSMITH_TRACING: "false"
          LANGSMITH_API_KEY: ""
          SQLITE_DB_PATH: ":memory:"
          # Deliberately hostile: build toolchains commonly export a non-boolean
          # DEBUG. This used to make agent_bargain.config raise at import time,
          # killing pytest collection. Keep it set so CI catches a regression.
          DEBUG: "release"
          APP_DEBUG: "false"
